name: noor
description: "NOOR — Your Premium Islamic Lifestyle Companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # Location & Compass
  geolocator: ^13.0.2
  flutter_compass: ^0.8.0

  # Charts
  fl_chart: ^0.70.2

  # Animations
  flutter_animate: ^4.5.2

  # Network & Images
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1

  # UI Utilities
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  smooth_page_indicator: ^1.2.0+3

  # Utils
  permission_handler: ^11.3.1

  # Calendar
  table_calendar: ^3.1.2
  hijri: ^3.0.0
  audioplayers: ^6.6.0
  syncfusion_flutter_pdfviewer: ^33.2.6
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/book thumb/
    - assets/images/Quran.png
    - assets/images/prayer.png
    - assets/images/qibla.png
    - assets/images/dua.png
    - assets/images/tasbih.png
    - assets/images/zakat.png
    - assets/images/salah.png
    - assets/icons/
    - assets/lottie/
    - assets/data/

#  fonts:
#    - family: Amiri
#      fonts:
#        - asset: assets/fonts/Amiri-Regular.ttf
#        - asset: assets/fonts/Amiri-Bold.ttf
#          weight: 700

dependency_overrides:
  path_provider_foundation: 2.3.1
  shared_preferences_foundation: 2.3.5
